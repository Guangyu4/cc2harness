<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sshpro · 网页终端</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="vendor/xterm.css?v=5">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="logo">ssh<span>pro</span></div>
    <nav id="tabs"></nav>
    <button id="btn-new" class="icon-btn" title="新建终端（新的 tmux 会话）">＋</button>
    <div class="spacer"></div>
    <button id="btn-copy" class="icon-btn" title="强制选中复制：即使 vim/htop 等接管鼠标也能划词，选中自动复制">⧉</button>
    <button id="btn-files" class="icon-btn" title="显示 / 隐藏文件面板">▥</button>
    <button id="btn-destroy" class="icon-btn danger" title="彻底销毁当前会话（终止其中运行的程序）">🗑</button>
  </header>

  <div id="main">
    <div id="terms">
      <div id="empty" hidden>
        <div class="empty-card">
          <div class="login-logo">ssh<span>pro</span></div>
          <p>没有打开的终端</p>
          <button id="btn-empty-new">＋ 新建终端</button>
        </div>
      </div>
    </div>

    <aside id="files">
      <div class="fp-head">
        <button id="fp-up" class="fp-btn" title="上级目录">↑</button>
        <div id="fp-path" title="">—</div>
        <button id="fp-follow" class="fp-btn" title="跟随终端当前目录（手动进入其他目录后点此恢复跟随）">⇄</button>
        <button id="fp-refresh" class="fp-btn" title="刷新">⟳</button>
      </div>
      <div id="fp-list"></div>
    </aside>
  </div>
</div>

<div id="viewer" class="hidden">
  <div class="viewer-card">
    <div class="viewer-head">
      <div id="viewer-title">—</div>
      <button id="viewer-dl" class="fp-btn" title="下载此文件">⬇ 下载</button>
      <button id="viewer-close" class="fp-btn" title="关闭 (Esc)">✕</button>
    </div>
    <div id="viewer-note" hidden></div>
    <pre id="viewer-body"></pre>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/xterm.js?v=5"></script>
<script src="vendor/addon-fit.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
